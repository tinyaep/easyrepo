[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "easyrepo"
version = "0.1.0"
description = "Turn any folder into a GitHub repository with a beautiful terminal UI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name"}
]
dependencies = [
    "textual>=0.80.0",
    "rich>=13.0.0",
]

[project.scripts]
easyrepo = "easyrepo.__main__:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/easyrepo"
Repository = "https://github.com/YOUR_USERNAME/easyrepo"

[tool.setuptools.packages.find]
where = ["."]
include = ["easyrepo*"]
